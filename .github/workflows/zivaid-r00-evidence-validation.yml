name: ZivaID R00 Evidence Validation Engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/zivaid/**'
      - 'tests/zivaid/**'
      - 'docs/product/zivaid/market-validation/r00/w01/**'
      - '.github/workflows/zivaid-r00-evidence-validation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/zivaid/**'
      - 'docs/product/zivaid/market-validation/r00/w01/**'
      - '.github/workflows/zivaid-r00-evidence-validation.yml'

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        working-directory: tools/zivaid
        run: python -m unittest -v test_r00_evidence_validation_engine.py
      - name: Run black-box verification suite when present
        if: hashFiles('tests/zivaid/test_r00_evidence_engine_blackbox.py') != ''
        run: python -m unittest -v tests/zivaid/test_r00_evidence_engine_blackbox.py
